[project]
name = "classification"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "jupyter",
    "matplotlib",
    "numpy",
    "pandas",
    "Pillow",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
